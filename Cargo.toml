[package]
name = "file-organizer"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = ["core"]

[dependencies]
organizer-core = { path = "core" }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.36.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["x11"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
